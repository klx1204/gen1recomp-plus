name: upstream-sync
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plus
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/bryanthaboi/gen1recomp.git
          git fetch upstream dev

      - name: Merge when upstream moved
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/dev --no-edit
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install LuaJIT
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Fork tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          luajit tests/phy_spc_test.lua
          luajit tests/phy_spc_guard.lua

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin plus

      - name: Report conflict
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "upstream sync failed" \
            --body "The scheduled merge of upstream/dev into plus failed. Resolve the conflict locally, run the fork tests, and push plus." \
            || true
